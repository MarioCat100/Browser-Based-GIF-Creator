<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="goatedpiano.png?v=1">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Goated Tiles</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
    <style>
    /* 1. BODY & BACKGROUND */
    body { 
        margin: 0; padding: 0; overflow: hidden; 
        background: #000; 
        font-family: sans-serif; 
    }

    /* 2. THE OVERLAY */
    .overlay { 
        position: absolute; 
        inset: 0; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        background: transparent !important; 
        z-index: 10; 
    }

    /* 3. THE BUTTONS */
    .btn { 
        width: 80%; max-width: 300px; padding: 18px; margin: 8px; 
        background: #000; color: #fff; border: 1px solid #f1c40f; 
        border-radius: 12px; font-size: 16px; font-weight: bold; 
        cursor: pointer;
    }

    .tab-btn {
        flex: 1; padding: 12px; font-size: 13px; font-weight: bold;
        border: 2px solid #f1c40f; background: #111; color: #fff;
        border-radius: 10px; cursor: pointer; transition: all 0.2s ease;
    }
    .tab-btn.active {
        background: #f1c40f; color: #000;
    }

    /* 4. THE SONG LIST */
    #song-list { 
        width: 90%; 
        max-width: 400px;
        height: 280px; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        overflow-y: auto; 
        background: rgba(0, 0, 0, 0.6); 
        backdrop-filter: blur(5px);
        border-radius: 15px;
        padding: 10px;
        border: 2px solid #f1c40f; 
    }

    .hidden { display: none !important; }

    /* Scrollbar */
    #song-list::-webkit-scrollbar { width: 8px; }
    #song-list::-webkit-scrollbar-thumb { background: #f1c40f; border-radius: 10px; }
</style>
</head>
<body>

<div id="home-screen" class="overlay">
    <h1 id="menu-title" style="letter-spacing: 8px; margin-top: 20px; margin-bottom: 15px; font-size: 38px; font-weight: 900; text-transform: uppercase;">
        GOATED TILES
    </h1>
    
    <!-- TAB TOGGLE -->
    <div style="display: flex; gap: 10px; width: 90%; max-width: 400px; margin-bottom: 15px;">
        <button id="tab-classic" class="tab-btn active" onclick="switchTab('CLASSIC')">🎹 CLASSIC PIANO</button>
        <button id="tab-mp3" class="tab-btn" onclick="switchTab('MP3')">🔥 GOATED MP3s</button>
    </div>

    <!-- SETTINGS ROW -->
    <div id="settings-bar" style="display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; width: 95%;"></div>

    <div id="song-list"></div>
</div>

<div id="death-screen" class="overlay hidden">
    <h1 id="fail-text">FAILED</h1>
    <h2 id="final-score">SCORE: 0</h2>
    <button id="continue-btn" class="btn" style="background:#9b59b6" onclick="handleRevive()">CONTINUE</button>
    <button class="btn" onclick="restartGame()">RESTART</button>
    <button class="btn" style="background:#666" onclick="goHome()">HOME</button>
</div>

<script>
let activeTab = "CLASSIC"; 
let canContinue = false;  
let combo = 0;    
let isProMode = false;     
let controlMode = "CLICK";     
let currentPulseColor = [255, 215, 0];     
let pulseMode = false;     
let feedbackText = "";
let feedbackColor = "#fff";
let feedbackTimer = 0;    
let mySound, amp, tiles = [], score = 0, gameState = "MENU";
let currentSongUrl = "", speed = 9, alpha = 0;

// CLASSIC PIANO SCROLL ENGINE VARIABLES
let cameraY = 0;
let targetCameraY = 0;
let currentNoteIndex = 0;
let synth;

const classicSongs = [
    { name: "Hikaru Nara (Your Lie in April)", notes: [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25], color: [255, 105, 180] },
    { name: "Ballade No. 1 (Your Lie in April)", notes: [196.00, 220.00, 246.94, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25], color: [147, 112, 219] },
    { name: "Rondo Capriccioso (Your Lie in April)", notes: [329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25], color: [255, 215, 0] },
    { name: "Für Elise", notes: [659.25, 622.25, 659.25, 622.25, 659.25, 493.88, 587.33, 523.25, 440.00], color: [135, 206, 235] },
    { name: "Canon in D", notes: [293.66, 220.00, 246.94, 185.00, 196.00, 146.83, 196.00, 220.00], color: [160, 255, 210] }
];

const mySongs = [
    { name: "Legendary Lovers", url: "./Legendary Lovers.mp3", color: [255, 182, 193] },
    { name: "Wheels Fall OFF", url: "./Wheels Fall Off.mp3", color: [255, 215, 0] },
    { name: "Tom Cruise", url: "./Tom Cruise.mp3", color: [135, 206, 235] },
    { name: "3005", url: "./3005.mp3", color: [147, 112, 219] },
    { name: "Rather Lie", url: "./RATHER LIE.mp3", color: [173, 216, 230] },
    { name: "Do It", url: "./DO IT.mp3", color: [255, 102, 0] },
    { name: "Dark Thoughts", url: "./Dark Thoughts.mp3", color: [25, 25, 112] },
    { name: "Wavy", url: "./Wavy.mp3", color: [0, 191, 255] },
    { name: "Jennifer", url: "./Jennifer.mp3", color: [0, 71, 49] },
    { name: "My Way - Fetty Wap", url: "./My Way.mp3", color: [106, 13, 173] },
    { name: "Kill Bill", url: "./Kill Bill.mp3", color: [38, 89, 229] },
    { name: "All The Love", url: "./ALL THE LOVE.mp3", color: [255, 140, 0] },
    { name: "Scott and Zelda", url: "./Scott and Zelda.mp3", color: [255, 0, 127] },
    { name: "Jocelyn Flores", url: "./Jocelyn Flores.mp3", color: [100, 110, 140] },
    { name: "Magnetic", url: "./Magnetic.mp3", color: [160, 255, 210] },
    { name: "Nicotine Patches", url: "./Nicotine Patches.mp3", color: [160, 0, 0] }
];

function setup() {
    createCanvas(windowWidth, windowHeight);
    synth = new p5.Oscillator('sine');
    amp = new p5.Amplitude();
    renderSettingsBar();
    renderSongList();
    playMenuPreview();
}

function renderSettingsBar() {
    const settings = document.getElementById('settings-bar');
    settings.innerHTML = `
        <button class="btn" onclick="togglePulse()" 
            style="background: ${pulseMode ? '#2ecc71' : '#666'}; width: 85px; padding: 10px; font-size: 12px;">
            VFX: ${pulseMode ? 'ON' : 'OFF'}
        </button>

        <button class="btn" onclick="togglePro()" 
            style="background: ${isProMode ? '#f1c40f' : '#666'}; width: 85px; padding: 10px; font-size: 12px; color: ${isProMode ? '#000' : '#fff'};">
            PRO: ${isProMode ? 'ON' : 'OFF'}
        </button>

        <button class="btn" onclick="togglePractice()" 
            style="background: ${canContinue ? '#9b59b6' : '#666'}; width: 85px; padding: 10px; font-size: 11px;">
            PRACTICE: ${canContinue ? 'ON' : 'OFF'}
        </button>
        
        <button class="btn" onclick="toggleControls()" 
            style="background: #3498db; width: 85px; padding: 10px; font-size: 12px;">
            ${controlMode}
        </button>
    `;
}

function switchTab(tab) {
    activeTab = tab;
    document.getElementById('tab-classic').className = "tab-btn " + (tab === 'CLASSIC' ? 'active' : '');
    document.getElementById('tab-mp3').className = "tab-btn " + (tab === 'MP3' ? 'active' : '');
    renderSongList();
}

function renderSongList() {
    const list = document.getElementById('song-list');
    list.innerHTML = ""; 
    const songsToRender = activeTab === "CLASSIC" ? classicSongs : mySongs;

    songsToRender.forEach(s => {
        let key = activeTab === "CLASSIC" ? "best_classic_" + s.name : "best_" + s.url;
        let savedBest = localStorage.getItem(key) || 0;
        let btn = document.createElement('button');
        btn.className = "btn";
        btn.innerHTML = `${s.name}<br><span style="font-size: 12px; opacity: 0.7;">Best: ${savedBest}</span>`;
        
        btn.onclick = () => { 
            currentPulseColor = s.color;
            if (activeTab === "CLASSIC") {
                startClassicGame(s);
            } else {
                currentSongUrl = s.url; 
                loadAndStartMP3(); 
            }
        };
        
        list.appendChild(btn);
    });
}

let activeClassicSong = null;

function startClassicGame(songObj) {
    activeClassicSong = songObj;
    if (previewSound) previewSound.stop();
    if (mySound) mySound.stop();

    document.getElementById('home-screen').classList.add('hidden');
    document.getElementById('death-screen').classList.add('hidden');
    gameState = "PLAYING_CLASSIC";
    score = 0;
    cameraY = 0;
    targetCameraY = 0;
    currentNoteIndex = 0;
    tiles = [];

    let rowH = height / 4;
    for (let r = 0; r < 200; r++) {
        let lane = floor(random(4));
        tiles.push({ lane: lane, yIndex: r, rowY: height - (r * rowH) - rowH, hit: false });
    }
}

function loadAndStartMP3() {
    if (previewSound) previewSound.stop();
    if (mySound) mySound.stop();

    document.getElementById('home-screen').innerHTML = "<h1 class='title-3d' style='font-size:24px; color:#fff;'>LOADING...</h1>";
    
    mySound = loadSound(currentSongUrl, () => {
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('death-screen').classList.add('hidden');
        startGameMP3();
    });
}

function startGameMP3() {
    tiles = []; score = 0; speed = 9; frameCount = 0; combo = 0; gameState = "PLAYING_MP3";
    tiles.push(new TileMP3(floor(random(4))));
    if (mySound) {
        mySound.stop();
        mySound.play();
    }
}

class TileMP3 {
    constructor(lane) {
        this.lane = lane;
        this.w = width / 4;
        this.h = height / 5;
        this.x = this.lane * this.w;
        this.y = -this.h * 2;
        this.once = true;
        this.isHit = false;
        this.hitAlpha = 255;
    }

    move(v, a) { this.y += (v * speed) + a; }

    show() {
        push();
        if (this.isHit) {
            fill(180, 180, 180, this.hitAlpha);
            stroke(220); strokeWeight(1);
            rect(this.x, this.y, this.w, this.h);
            this.hitAlpha -= 40;
        } else {
            noStroke(); fill(0, 30);
            rect(this.x + 4, this.y + 4, this.w - 8, this.h - 8, 8); 
            fill(26, 26, 30); stroke(255, 60); strokeWeight(1.5);
            rect(this.x + 2, this.y + 2, this.w - 4, this.h - 4, 8);
            fill(255, 25); noStroke();
            rect(this.x + 6, this.y + 6, this.w - 12, this.h / 3.5, 4); 
        }
        pop();
    }
}

function draw() {
    if (gameState === "MENU") {
        background(0);
        let vol = amp.getLevel();
        let r = currentPulseColor[0], g = currentPulseColor[1], b = currentPulseColor[2];

        let title = document.getElementById('menu-title');
        if (title) {
            title.style.color = `rgb(${r}, ${g}, ${b})`;
            let titleScale = map(vol, 0, 0.3, 1.0, 1.1);
            title.style.transform = `scale(${titleScale})`;
        }

        noFill(); strokeWeight(3);
        for (let i = 0; i < 3; i++) {
            stroke(r, g, b, 150 - (i * 40)); 
            beginShape();
            for (let x = 0; x <= width; x += 25) {
                let angle = (x * 0.002) + (frameCount * 0.02) + (i * 0.8);
                let y = height / 2 + sin(angle) * (60 + (vol * 500)); 
                vertex(x, y);
            }
            endShape();
        }
        return; 
    }

    if (gameState === "PLAYING_CLASSIC") {
        background(255);
        cameraY = lerp(cameraY, targetCameraY, 0.2);

        push();
        translate(0, cameraY);

        let rowH = height / 4;
        let colW = width / 4;

        stroke(200); strokeWeight(1.5);
        for (let c = 1; c < 4; c++) line(c * colW, -10000, c * colW, height + 10000);
        for (let r = -10; r < 210; r++) line(0, height - (r * rowH), width, height - (r * rowH));

        for (let t of tiles) {
            let tileY = t.rowY;
            if (t.hit) {
                fill(200);
                rect(t.lane * colW, tileY, colW, rowH);
            } else {
                fill(20, 20, 25);
                rect(t.lane * colW, tileY, colW, rowH);
            }
        }
        pop();

        fill(255, 0, 0); noStroke(); textSize(50); textAlign(CENTER);
        text(score, width / 2, 80);
        return;
    }

    if (gameState !== "PLAYING_MP3") return;

    if (pulseMode) {
        let vol = amp.getLevel();
        let r = currentPulseColor[0], g = currentPulseColor[1], b = currentPulseColor[2];
        background(map(vol, 0, 0.3, 255, r), map(vol, 0, 0.3, 255, g), map(vol, 0, 0.3, 255, b));
    } else {
        background(255);
    }
    
    alpha = min(frameCount / 100, 11.0);
    let vol = amp.getLevel();
    let varR = vol < 0.2 ? 0.8 : map(vol, 0.4, 1, 0.8, 1.2);

    stroke(220); strokeWeight(1.5);
    for (let i = 1; i < 4; i++) line(i * width/4, 0, i * width/4, height);
    let gridStep = height / 5;
    for (let y = 0; y <= height; y += gridStep) line(0, y, width, y);

    let proMultiplier = isProMode ? 1.35 : 1.0; 

    for (let i = tiles.length - 1; i >= 0; i--) {
        let t = tiles[i];
        t.move(varR * proMultiplier, alpha); 
        t.show();

        if (t.y > -t.h + 5 && t.once) {
            t.once = false;
            tiles.push(new TileMP3(floor(random(4))));
        }

        if (t.isHit && t.hitAlpha <= 0) {
            tiles.splice(i, 1);
            continue;
        }

        if (t.y > height && !t.isHit) {
            combo = 0; triggerGameOver();
        }
    }

    fill(255, 0, 0); noStroke(); textSize(50); textAlign(CENTER);
    text(score, width / 2, 80);

    if (feedbackTimer > 0) {
        fill(feedbackColor);
        textSize(40);
        text(feedbackText, width / 2, height / 2 + 50);
        feedbackTimer--; 
    }
}

function mousePressed() {
    if (gameState === "MENU" || gameState === "GAMEOVER") return;
    if (getAudioContext().state !== 'running') getAudioContext().resume();
    let clickedLane = floor(mouseX / (width / 4));
    handleInput(clickedLane);
}

function keyPressed() {
    if (gameState === "MENU" || gameState === "GAMEOVER") return;
    if (getAudioContext().state !== 'running') getAudioContext().resume();

    let targetLane = -1;
    if (key === 'a' || key === 'A' || keyCode === LEFT_ARROW)  targetLane = 0;
    if (key === 's' || key === 'S' || keyCode === UP_ARROW)    targetLane = 1;
    if (key === 'w' || key === 'W' || keyCode === DOWN_ARROW)  targetLane = 2;
    if (key === 'd' || key === 'D' || keyCode === RIGHT_ARROW) targetLane = 3; 

    if (targetLane !== -1) handleInput(targetLane);
}

function touchStarted() {
    if (gameState === "MENU" || gameState === "GAMEOVER") return;
    if (getAudioContext().state !== 'running') getAudioContext().resume();

    let targetLane = floor(map(mouseX, 0, width, 0, 4));
    if (targetLane >= 0 && targetLane <= 3) {
        handleInput(targetLane);
    }
    return false;
}

function handleInput(lane) {
    if (gameState === "PLAYING_CLASSIC") {
        checkHitClassic(lane);
    } else if (gameState === "PLAYING_MP3") {
        checkHitMP3(lane);
    }
}

function checkHitClassic(lane) {
    let targetTile = tiles[score];
    if (targetTile && targetTile.lane === lane) {
        targetTile.hit = true;
        score++;
        targetCameraY += height / 4;

        let noteFreq = activeClassicSong.notes[currentNoteIndex % activeClassicSong.notes.length];
        currentNoteIndex++;
        synth.freq(noteFreq);
        synth.start();
        synth.amp(0.5, 0.05);
        setTimeout(() => synth.amp(0, 0.1), 150);

    } else {
        triggerGameOver();
    }
}

function checkHitMP3(lane) {
    let t = tiles[0]; 
    
    if (t && t.lane === lane) {
        if (t.y > -t.h && t.y < height) {
            let distFromBottom = abs(height - (t.y + t.h));
            let multiplier = floor(combo / 10) + 1; 

            if (distFromBottom < 120) { 
                score += (2 * multiplier); 
                combo++; 
                showFeedback("PERFECT x" + multiplier, "#f1c40f"); 
            } else {
                score += (1 * multiplier);
                combo++; 
                showFeedback("GOOD x" + multiplier, "#2ecc71"); 
            }

            t.isHit = true;
        } else {
            combo = 0; 
            score = max(0, score - 5); 
            showFeedback("TOO EARLY!", "#e74c3c"); 
        }
    } else {
        combo = 0; 
        triggerGameOver();
    }
}

function triggerGameOver() {
    gameState = "GAMEOVER";
    if (synth) synth.stop();
    if (mySound) mySound.pause();

    let scoreKey = (activeTab === "CLASSIC" && activeClassicSong) 
        ? "best_classic_" + activeClassicSong.name 
        : "best_" + currentSongUrl;
        
    let previousBest = parseInt(localStorage.getItem(scoreKey)) || 0;
    let isNewRecord = (score > previousBest);

    if (isNewRecord) localStorage.setItem(scoreKey, score);

    document.getElementById('fail-text').innerText = isNewRecord ? "NEW HIGH SCORE!" : "FAILED";
    document.getElementById('fail-text').style.color = isNewRecord ? "#2ecc71" : "#e74c3c"; 
    
    document.getElementById('final-score').innerHTML = `
        SCORE: ${score}<br>
        <span style="font-size: 18px; color: #666;">BEST: ${isNewRecord ? score : previousBest}</span>
    `;
    
    const contBtn = document.getElementById('continue-btn');
    if (canContinue) {
        contBtn.style.display = "block";
    } else {
        contBtn.style.display = "none";
    }

    const deathScreen = document.getElementById('death-screen');
    deathScreen.classList.remove('hidden');

    let deathButtons = deathScreen.querySelectorAll('.btn');
    deathButtons.forEach(btn => {
        btn.style.visibility = "visible";
        btn.style.opacity = "1";
    });
}

function handleRevive() {
    document.getElementById('death-screen').classList.add('hidden');
    tiles = []; 
    combo = 0; 
    
    if (activeTab === "CLASSIC") {
        startClassicGame(activeClassicSong);
    } else {
        tiles.push(new TileMP3(floor(random(4)))); 
        gameState = "PLAYING_MP3";
        if (mySound) mySound.play(); 
        showFeedback("RESUMED", "#9b59b6");
    }
}

function restartGame() {
    document.getElementById('death-screen').classList.add('hidden');
    if (activeTab === "CLASSIC") {
        startClassicGame(activeClassicSong);
    } else {
        startGameMP3();
    }
}

function goHome() {
    if (synth) synth.stop();
    if (mySound) mySound.stop();
    gameState = "MENU";
    document.getElementById('death-screen').classList.add('hidden');
    const home = document.getElementById('home-screen');
    home.classList.remove('hidden');
    renderSettingsBar();
    renderSongList();
    playMenuPreview();
}

function showFeedback(txt, col) {
    feedbackText = txt;
    feedbackColor = col;
    feedbackTimer = 25; 
}

function togglePulse() { pulseMode = !pulseMode; renderSettingsBar(); }
function toggleControls() { controlMode = (controlMode === "CLICK") ? "KEYBOARD" : "CLICK"; renderSettingsBar(); }
function togglePro() { isProMode = !isProMode; renderSettingsBar(); }
function togglePractice() { canContinue = !canContinue; renderSettingsBar(); }

let previewSound; 
function playMenuPreview() {
    if (previewSound && previewSound.isPlaying()) return;
    if (mySound) mySound.stop();
    let randomSong = random(mySongs);
    previewSound = loadSound(randomSong.url, () => {
        if (gameState === "MENU") {
            previewSound.play();
            previewSound.setVolume(0.4); 
            currentPulseColor = randomSong.color;
        }
    });
}
</script>
</body>
</html>
