    /* 1. BODY & BACKGROUND */

        margin: 0; padding: 0; overflow: hidden;

    }

    /* 2. THE OVERLAY */
    .overlay { 
        position: absolute; 
        inset: 0; 
        display: flex; 
        flex-direction: column;

        justify-content: center;

        z-index: 10;

    document.getElementById('tab-mp3').className = "tab-btn " + (tab === 'MP3' ? 'active' : '');
    renderSongList();
}

function renderSongList() {
    const list = document.getElementById('song-list');
    list.innerHTML = ""; 
    
    if (activeTab === "CLASSIC") {
        classicSongs.forEach(s => {
            let savedBest = localStorage.getItem("best_classic_" + s.name) || 0;

            btn.className = "btn";
            btn.innerHTML = s.name + '<br><span style="font-size: 12px; opacity: 0.7;">Best: ' + savedBest + '</span>';
            
            btn.onclick = () => { 
                currentPulseColor = s.color; 
                startClassicGame(s);
            };
            
            list.appendChild(btn);
        });
    } else {
        mySongs.forEach(s => {
            let savedBest = localStorage.getItem("best_" + s.url) || 0;

// --- START CLASSIC BOARD-SCROLL ENGINE ---
function startClassicGame(songObj) {
    activeClassicSong = songObj;
    if (previewSound) previewSound.stop();
    if (mySound) mySound.stop();

    document.getElementById('home-screen').classList.add('hidden');
    document.getElementById('death-screen').classList.add('hidden');
    
    gameState = "PLAYING_CLASSIC";
    score = 0;
    cameraY = 0;
    targetCameraY = 0;
    currentNoteIndex = 0;
    tiles = [];

    // Pre-generate a board row track
    let rowH = height / 4;
    for (let r = 0; r < 200; r++) {
        let lane = floor(random(4));
        tiles.push({ lane: lane, yIndex: r, rowY: height - (r * rowH) - rowH, hit: false });
    }
}

function loadAndStart() {
    if (previewSound) {
        previewSound.stop();
        previewSound.dispose(); 
    }
    
    if (mySound) mySound.stop();

    document.getElementById('home-screen').innerHTML = "<h1 class='title-3d' style='font-size:24px;'>LOADING...</h1>";
    
    mySound = loadSound(currentSongUrl, () => {
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('death-screen').classList.add('hidden');
        startGame();
    });
}

function startGame() {
    tiles = []; score = 0; speed = 9; frameCount = 0; combo = 0; gameState = "PLAYING";
    tiles.push(new Tile(floor(random(4))));
    if (mySound) {
        mySound.stop();
        mySound.play();
    }
}

class Tile {
    constructor(lane) {
        this.lane = lane;
        this.w = width / 4;
        this.h = height / 5;
        this.x = this.lane * this.w;
        this.y = -this.h * 2;
        this.once = true;
        this.isHit = false;
        this.hitAlpha = 255;
    }

    move(v, a) { 
        this.y += (v * speed) + a; 
    }

    show() {
        push(); 
        
        if (this.isHit) {
            fill(180, 180, 180, this.hitAlpha);
            stroke(220);
            strokeWeight(1);
            rect(this.x, this.y, this.w, this.h);
            this.hitAlpha -= 40; 
        } else {
            noStroke();
            fill(0, 30); 
            rect(this.x + 4, this.y + 4, this.w - 8, this.h - 8, 8); 

            fill(26, 26, 30); 
            stroke(255, 60); 
            strokeWeight(1.5);
            rect(this.x + 2, this.y + 2, this.w - 4, this.h - 4, 8);
            
            fill(255, 25); 
            noStroke();
            rect(this.x + 6, this.y + 6, this.w - 12, this.h / 3.5, 4); 
        }

        pop();
    }
}

function draw() {
    if (gameState === "MENU") {
        background(0); 
        
        let vol = amp.getLevel();
        let r = currentPulseColor[0];
        let g = currentPulseColor[1];
        let b = currentPulseColor[2];

        let title = document.getElementById('menu-title');
        if (title) {
            title.style.color = "rgb(" + r + ", " + g + ", " + b + ")";
            let titleScale = map(vol, 0, 0.3, 1.0, 1.1);
            title.style.transform = "scale(" + titleScale + ")";
        }

        noFill();
        strokeWeight(3);
        
        for (let i = 0; i < 3; i++) {
            stroke(r, g, b, 150 - (i * 40)); 
            
            beginShape();
            for (let x = 0; x <= width; x += 25) {
                let angle = (x * 0.002) + (frameCount * 0.02) + (i * 0.8);
                let y = height / 2 + sin(angle) * (60 + (vol * 500)); 
                vertex(x, y);
            }
            endShape();
        }
        
        return; 
    }

    // --- DRAW CLASSIC BOARD-SCROLL MODE (INFINITE GRID) ---
    if (gameState === "PLAYING_CLASSIC") {
        background(255);
        cameraY = lerp(cameraY, targetCameraY, 0.2);

        push();
        translate(0, cameraY);

        let rowH = height / 4;
        let colW = width / 4;

        stroke(200); strokeWeight(1.5);
        
        // Infinite Vertical Dividers
        for (let c = 1; c < 4; c++) line(c * colW, -50000, c * colW, height + 10000);
        
        // Infinite Horizontal Grid Lines mapped dynamically to active Camera Range
        let minRow = floor((-cameraY - height) / rowH);
        let maxRow = ceil((-cameraY + height * 2) / rowH);
        for (let r = minRow; r <= maxRow; r++) {
            line(0, height - (r * rowH), width, height - (r * rowH));
        }

        for (let t of tiles) {
            let tileY = t.rowY;
            if (t.hit) {
                fill(200);
                rect(t.lane * colW, tileY, colW, rowH);
            } else {
                fill(20, 20, 25);
                rect(t.lane * colW, tileY, colW, rowH);
            }
        }
        pop();

        fill(255, 0, 0); noStroke(); textSize(50); textAlign(CENTER);
        text(score, width / 2, 80);
        return;
    }

    if (gameState !== "PLAYING") return;

    if (pulseMode) {
        let vol = amp.getLevel();
        let r = currentPulseColor[0];
        let g = currentPulseColor[1];
        let b = currentPulseColor[2];

        let pR = map(vol, 0, 0.3, 255, r);
        let pG = map(vol, 0, 0.3, 255, g);
        let pB = map(vol, 0, 0.3, 255, b);
        background(pR, pG, pB);
    } else {
        background(255);
    }
    
    alpha = min(frameCount / 100, 11.0);
    let vol = amp.getLevel();
    let varR = vol < 0.2 ? 0.8 : map(vol, 0.4, 1, 0.8, 1.2);

    stroke(220);
    strokeWeight(1.5);
    
    for (let i = 1; i < 4; i++) {
        line(i * width/4, 0, i * width/4, height);
    }
    
    let gridStep = height / 5;
    for (let y = 0; y <= height; y += gridStep) {
        line(0, y, width, y);
    }

    let proMultiplier = isProMode ? 1.35 : 1.0; 

    for (let i = tiles.length - 1; i >= 0; i--) {
        let t = tiles[i];
        t.move(varR * proMultiplier, alpha); 
        t.show();

        if (t.y > -t.h + 5 && t.once) {
            t.once = false;
            tiles.push(new Tile(floor(random(4))));
        }

        if (t.isHit && t.hitAlpha <= 0) {
            tiles.splice(i, 1);
            continue;
        }

        if (t.y > height && !t.isHit) {
            combo = 0; 
            triggerGameOver();
        }
    }

    fill(255, 0, 0); 
    noStroke();
    textSize(50);
    textAlign(CENTER);
    text(score, width / 2, 80);

    if (combo > 1) {
        let shake = map(vol, 0, 0.3, 0, 8); 
        fill(255, 215, 0); 
        textSize(min(30 + combo, 70)); 
        text("x" + combo, width / 2 + random(-shake, shake), 140);
        
        let m = floor(combo / 10) + 1;
        if (m > 1) {
            textSize(20);
            text(m + "X POINTS", width / 2, 190);
        }

        let rank = "CLEAN";
        if (combo > 15) rank = "CRISP";
        if (combo > 30) rank = "GOATED";
        
        textSize(15);
        fill(255); 
        text(rank, width / 2, 165);
    }

    if (feedbackTimer > 0) {
        fill(feedbackColor);
        textSize(40);
        text(feedbackText, width / 2, height / 2 + 50);
        feedbackTimer--; 
    }

    rectMode(CORNER); 
    fill(isProMode ? "#FFD700" : 200); 
    stroke(0);
    strokeWeight(2);
    rect(20, 20, 80, 40, 5); 

    fill(0);
    noStroke();
    textSize(16);
    textAlign(CENTER, CENTER);
    text("PRO", 60, 40); 
}

// ROUTED INPUT HANDLING
function mousePressed() {
    if (gameState === "MENU" || gameState === "GAMEOVER") return;
    if (getAudioContext().state !== 'running') getAudioContext().resume();
    let clickedLane = floor(mouseX / (width / 4));
    
    if (gameState === "PLAYING_CLASSIC") {
        checkHitClassic(clickedLane);
    } else if (gameState === "PLAYING") {
        checkHit(clickedLane);
    }
}

function keyPressed() {
    if (gameState === "MENU" || gameState === "GAMEOVER") return;
    if (getAudioContext().state !== 'running') getAudioContext().resume();

    let targetLane = -1;
    if (key === 'a' || key === 'A' || keyCode === LEFT_ARROW)  targetLane = 0;
    if (key === 's' || key === 'S' || keyCode === UP_ARROW)    targetLane = 1;
    if (key === 'w' || key === 'W' || keyCode === DOWN_ARROW)  targetLane = 2;
    if (key === 'd' || key === 'D' || keyCode === RIGHT_ARROW) targetLane = 3; 

    if (targetLane !== -1) {
        if (gameState === "PLAYING_CLASSIC") {
            checkHitClassic(targetLane);
        } else if (gameState === "PLAYING") {
            checkHit(targetLane);
        }
    }
}

function touchStarted() {
    if (gameState === "MENU" || gameState === "GAMEOVER") return;
    if (getAudioContext().state !== 'running') getAudioContext().resume();

    let targetLane = floor(map(mouseX, 0, width, 0, 4));
    if (targetLane >= 0 && targetLane <= 3) {
        if (gameState === "PLAYING_CLASSIC") {
            checkHitClassic(targetLane);
        } else if (gameState === "PLAYING") {
            checkHit(targetLane);
        }
    }
    return false; 
}

function checkHitClassic(lane) {
    let targetTile = tiles[score];
    if (targetTile && targetTile.lane === lane) {
        targetTile.hit = true;
        score++;
        targetCameraY += height / 4;

        // Trigger Real Acoustic Grand Piano Sample / Chords
        let currentEntry = activeClassicSong.notes[currentNoteIndex % activeClassicSong.notes.length];
        currentNoteIndex++;

        if (piano) {
            if (Array.isArray(currentEntry)) {
                currentEntry.forEach(note => piano.play(note));
            } else {
                piano.play(currentEntry);
            }
        }

    } else {
        triggerGameOver();
    }
}

function checkHit(lane) {
    let t = tiles[0]; 
    
    if (t && t.lane === lane) {
        if (t.y > -t.h && t.y < height) {
            let distFromBottom = abs(height - (t.y + t.h));
            let multiplier = floor(combo / 10) + 1; 

            if (distFromBottom < 120) { 
                score += (2 * multiplier); 
                combo++; 
                showFeedback("PERFECT x" + multiplier, "#f1c40f"); 
            } else {
                score += (1 * multiplier);
                combo++; 
                showFeedback("GOOD x" + multiplier, "#2ecc71"); 
            }

            t.isHit = true;
        } else {
            combo = 0; 
            score = max(0, score - 5); 
            showFeedback("TOO EARLY!", "#e74c3c"); 
        }
    } else {
        combo = 0; 
        triggerGameOver();
    }
}

function triggerGameOver() {
    gameState = "GAMEOVER";
    
    if (canContinue) {
        if (mySound) mySound.pause(); 
    } else {
        if (mySound) mySound.stop();
    }

    let scoreKey = (activeTab === "CLASSIC" && activeClassicSong)
        ? "best_classic_" + activeClassicSong.name 
        : "best_" + currentSongUrl;

    let previousBest = parseInt(localStorage.getItem(scoreKey)) || 0;
    let isNewRecord = (score > previousBest);

    if (isNewRecord) {
        localStorage.setItem(scoreKey, score);
    }

    let failText = isNewRecord ? "NEW HIGH SCORE!" : "FAILED";
    document.getElementById('fail-text').innerText = failText;
    document.getElementById('fail-text').style.color = isNewRecord ? "#2ecc71" : "#e74c3c"; 
    
    document.getElementById('final-score').innerHTML = 
        'SCORE: ' + score + '<br><span style="font-size: 18px; color: #666;">BEST: ' + (isNewRecord ? score : previousBest) + '</span>';
    
    const contBtn = document.getElementById('continue-btn');
    if (canContinue) {
        contBtn.style.display = "block"; 
    } else {
        contBtn.style.display = "none";
    }

    const deathScreen = document.getElementById('death-screen');
    deathScreen.classList.remove('hidden');
    
    let deathButtons = deathScreen.querySelectorAll('.btn');
    deathButtons.forEach(btn => {
        btn.style.visibility = "visible";
        btn.style.opacity = "1";
    });
}

function restartGame() {
    document.getElementById('death-screen').classList.add('hidden');
    if (activeTab === "CLASSIC") {
        startClassicGame(activeClassicSong);
    } else {
        startGame();
    }
}

function goHome() {
    if (mySound) mySound.stop();
    gameState = "MENU";
    
    document.getElementById('death-screen').classList.add('hidden');
    
    const home = document.getElementById('home-screen');
    home.classList.remove('hidden');
    
    renderMenu();
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }

function showFeedback(txt, col) {
    feedbackText = txt;
    feedbackColor = col;
    feedbackTimer = 25; 
}

function togglePulse() {
    pulseMode = !pulseMode; 
    renderMenu(); 
}

function toggleControls() {
    controlMode = (controlMode === "CLICK") ? "KEYBOARD" : "CLICK";
    renderMenu(); 
}

function togglePro() {
    isProMode = !isProMode; 
    renderMenu(); 
}

function togglePractice() {
    canContinue = !canContinue; 
    renderMenu(); 
}

function handleRevive() {
    document.getElementById('death-screen').classList.add('hidden');
    combo = 0; 
    
    if (activeTab === "CLASSIC") {
        startClassicGame(activeClassicSong);
    } else {
        tiles = []; 
        tiles.push(new Tile(floor(random(4)))); 
        gameState = "PLAYING";
        if (mySound) mySound.play(); 
        showFeedback("RESUMED", "#9b59b6");
    }
}

let previewSound; 

function playMenuPreview() {
    if (previewSound && previewSound.isPlaying()) return;
    if (mySound) mySound.stop();

    let randomSong = random(mySongs);
    
    previewSound = loadSound(randomSong.url, () => {
        if (gameState === "MENU") {
            previewSound.play();
            previewSound.setVolume(0.4); 
            currentPulseColor = randomSong.color;
        }
    });
}
</script>
