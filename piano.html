<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="goatedpiano.png?v=1">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Goated Tiles</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
    <style>
    /* 1. BODY & BACKGROUND */
    body { 
        margin: 0; padding: 0; overflow: hidden; 
        background: transparent; /* Allows p5.js canvas to show */
        font-family: sans-serif; 
    }

    /* 2. THE OVERLAY */
    .overlay { 
        position: absolute; 
        inset: 0; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        background: transparent !important; 
        z-index: 10; 
    }

    /* 3. THE BUTTONS */
    .btn { 
        width: 80%; max-width: 300px; padding: 20px; margin: 10px; 
        background: #000; color: #fff; border: 1px solid #f1c40f; 
        border-radius: 12px; font-size: 18px; font-weight: bold; 
        cursor: pointer;
    }

    /* 4. THE SONG LIST */
    #song-list { 
        width: 90%; 
        max-width: 400px;
        height: 300px; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        overflow-y: auto; 
        background: rgba(0, 0, 0, 0.4); 
        backdrop-filter: blur(5px);
        border-radius: 15px;
        padding: 10px;
        border: 2px solid #f1c40f; 
    }

    .hidden { display: none !important; }

    /* Scrollbar */
    #song-list::-webkit-scrollbar { width: 8px; }
    #song-list::-webkit-scrollbar-thumb { background: #f1c40f; border-radius: 10px; }
</style>
</head>
<body>

<div id="home-screen" class="overlay">
    <h1 style="letter-spacing: 5px;">GOATED TILES test67</h1>
    <div id="song-list"></div>
</div>

<div id="death-screen" class="overlay hidden">
    <h1 id="fail-text">FAILED</h1>
    <h2 id="final-score">SCORE: 0</h2>
    <button id="continue-btn" class="btn" style="background:#9b59b6" onclick="handleRevive()">CONTINUE</button>
    <button class="btn" onclick="restartGame()">RESTART</button>
    <button class="btn" style="background:#666" onclick="goHome()">HOME</button>
</div>

<script>
let canContinue = false; // Default is OFF (Normal Mode)  
let combo = 0;    
let isProMode = false; // Starts off by default    
let controlMode = "CLICK"; // Start in mobile/mouse mode    
let currentPulseColor = [255, 255, 255]; // Defaults to white    
let pulseMode = false; // Default is Classic (false)    
let feedbackText = "";
let feedbackColor = "#fff";
let feedbackTimer = 0;    
let mySound, amp, tiles = [], score = 0, gameState = "MENU";
let currentSongUrl = "", speed = 9, alpha = 0;

const mySongs = [
    { name: "Legendary Lovers", url: "./Legendary Lovers.mp3", color: [255, 182, 193] }, // Soft Pink
    { name: "Wheels Fall OFF", url: "./Wheels Fall Off.mp3", color: [255, 215, 0] },   // Gold
    { name: "Tom Cruise", url: "./Tom Cruise.mp3", color: [135, 206, 235] },          // Sky Blue (current)
    { name: "3005", url: "./3005.mp3", color: [147, 112, 219] },                     // Deep Purple
    { name: "Rather Lie", url: "./RATHER LIE.mp3", color: [173, 216, 230] },           // Light Blue
    { name: "Do It", url: "./DO IT.mp3", color: [255, 102, 0] },                         // Orange
    { name: "Dark Thoughts", url: "./Dark Thoughts.mp3", color: [25, 25, 112] },            // Midnight Blue
    { name: "Wavy", url: "./Wavy.mp3", color: [0, 191, 255] },
    { name: "Jennifer", url: "./Jennifer.mp3", color: [0, 71, 49] },                        //Deep Green
    { name: "My Way - Fetty Wap", url: "./My Way.mp3", color: [106, 13, 173] },                //classic purple
    { name: "Kill Bill", url: "./Kill Bill.mp3", color: [38, 89, 229] },                        // Deep Blue
    { name: "All The Love", url: "./ALL THE LOVE.mp3", color: [255, 140, 0] },                    // dark orange
    { name: "Scott and Zelda", url: "./Scott and Zelda.mp3", color: [255, 0, 127] },                //hot pink
    { name: "Jocelyn Flores", url: "./Jocelyn Flores.mp3", color: [100, 110, 140] },                // muted slate bluee
    { name: "Magnetic", url: "./Magnetic.mp3", color: [160, 255, 210] },                            // glowing mint
    { name: "Nicotine Patches", url: "./Nicotine Patches.mp3", color: [160, 0, 0] },                // Blood Red
];

function setup() {
    createCanvas(windowWidth, windowHeight);
    
    const home = document.getElementById('home-screen');
    
    home.innerHTML = `
        <h1 id="menu-title" style="letter-spacing: 8px; margin-top: 40px; margin-bottom: 25px; font-size: 45px; transition: color 0.4s ease, transform 0.1s ease; font-weight: 900; text-transform: uppercase;">
            GOATED TILES
        </h1>
        
        <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; width: 95%; margin-left: auto; margin-right: auto;">
            <button class="btn" onclick="togglePulse()" 
                style="background: ${pulseMode ? '#2ecc71' : '#666'}; width: 85px; padding: 10px; font-size: 12px;">
                VFX: ${pulseMode ? 'ON' : 'OFF'}
            </button>

            <button class="btn" onclick="togglePro()" 
                style="background: ${isProMode ? '#f1c40f' : '#666'}; width: 85px; padding: 10px; font-size: 12px; color: ${isProMode ? '#000' : '#fff'};">
                PRO: ${isProMode ? 'ON' : 'OFF'}
            </button>

            <button class="btn" onclick="togglePractice()" 
                style="background: ${canContinue ? '#9b59b6' : '#666'}; width: 85px; padding: 10px; font-size: 11px;">
                PRACTICE: ${canContinue ? 'ON' : 'OFF'}
            </button>
            
            <button class="btn" onclick="toggleControls()" 
                style="background: #3498db; width: 85px; padding: 10px; font-size: 12px;">
                ${controlMode}
            </button>
        </div>

        <div id="song-list"></div>
    `;
    const list = document.getElementById('song-list');
    list.innerHTML = ""; 

    mySongs.forEach(s => {
        let savedBest = localStorage.getItem("best_" + s.url) || 0;
        let btn = document.createElement('button');
        btn.className = "btn";
        btn.innerHTML = `${s.name}<br><span style="font-size: 12px; opacity: 0.7;">Best: ${savedBest}</span>`;
        
        btn.onclick = () => { 
            currentSongUrl = s.url; 
            currentPulseColor = s.color; 
            loadAndStart(); 
        };
        
        list.appendChild(btn);
    });

    amp = new p5.Amplitude();
    playMenuPreview();
}

function loadAndStart() {
    if (previewSound) {
        previewSound.stop();
        previewSound.dispose(); 
    }
    
    if (mySound) mySound.stop();

    document.getElementById('home-screen').innerHTML = "<h1 class='title-3d' style='font-size:24px;'>LOADING...</h1>";
    
    mySound = loadSound(currentSongUrl, () => {
        document.getElementById('home-screen').classList.add('hidden');
        startGame();
    });
}

function startGame() {
    tiles = []; score = 0; speed = 9; frameCount = 0; gameState = "PLAYING";
    tiles.push(new Tile(floor(random(4))));
    mySound.play();
}

class Tile {
    constructor(lane) {
        this.lane = lane;
        this.w = width / 4;
        this.h = height / 5;
        this.x = this.lane * this.w;
        this.y = -this.h * 2;
        this.once = true;
        this.isHit = false; // Tracks tap feedback
        this.hitAlpha = 255;
    }

    move(v, a) { 
        this.y += (v * speed) + a; 
    }

    show() {
        push(); 
        
        if (this.isHit) {
            // Piano Tiles Gray Tap Feedback
            fill(180, 180, 180, this.hitAlpha);
            stroke(220);
            strokeWeight(1);
            rect(this.x, this.y, this.w, this.h);
            this.hitAlpha -= 40; // Quick fade out
        } else {
            // Main Piano Tiles Style Grid-Cell
            noStroke();
            fill(0, 30); 
            rect(this.x + 4, this.y + 4, this.w - 8, this.h - 8, 8); 

            fill(26, 26, 30); 
            stroke(255, 60); 
            strokeWeight(1.5);
            rect(this.x + 2, this.y + 2, this.w - 4, this.h - 4, 8);
            
            fill(255, 25); 
            noStroke();
            rect(this.x + 6, this.y + 6, this.w - 12, this.h / 3.5, 4); 
        }

        pop();
    }
}

function draw() {
    if (gameState === "MENU") {
        background(0); 
        
        let vol = amp.getLevel();
        let r = currentPulseColor[0];
        let g = currentPulseColor[1];
        let b = currentPulseColor[2];

        let title = document.getElementById('menu-title');
        if (title) {
            title.style.color = `rgb(${r}, ${g}, ${b})`;
            let titleScale = map(vol, 0, 0.3, 1.0, 1.1);
            title.style.transform = `scale(${titleScale})`;
        }

        noFill();
        strokeWeight(3);
        
        for (let i = 0; i < 3; i++) {
            stroke(r, g, b, 150 - (i * 40)); 
            
            beginShape();
            for (let x = 0; x <= width; x += 25) {
                let angle = (x * 0.002) + (frameCount * 0.02) + (i * 0.8);
                let y = height / 2 + sin(angle) * (60 + (vol * 500)); 
                vertex(x, y);
            }
            endShape();
        }
        
        return; 
    }

    if (gameState !== "PLAYING") return;

    if (pulseMode) {
        let vol = amp.getLevel();
        let r = currentPulseColor[0];
        let g = currentPulseColor[1];
        let b = currentPulseColor[2];

        let pR = map(vol, 0, 0.3, 255, r);
        let pG = map(vol, 0, 0.3, 255, g);
        let pB = map(vol, 0, 0.3, 255, b);
        background(pR, pG, pB);
    } else {
        background(255);
    }
    
    // PIANO TILES ACCELERATION + SPEED CAP
    alpha = min(frameCount / 100, 11.0);
    let vol = amp.getLevel();
    let varR = vol < 0.2 ? 0.8 : map(vol, 0.4, 1, 0.8, 1.2);

    // --- DRAW PIANO TILES GRID (VERTICAL & HORIZONTAL LINES) ---
    stroke(220);
    strokeWeight(1.5);
    
    // Vertical Lane Dividers
    for (let i = 1; i < 4; i++) {
        line(i * width/4, 0, i * width/4, height);
    }
    
    // Horizontal Row Dividers (Creates the Piano Tiles grid)
    let gridStep = height / 5;
    for (let y = 0; y <= height; y += gridStep) {
        line(0, y, width, y);
    }

    // --- TILES UPDATE LOOP ---
    let proMultiplier = isProMode ? 1.35 : 1.0; 

    for (let i = tiles.length - 1; i >= 0; i--) {
        let t = tiles[i];
        t.move(varR * proMultiplier, alpha); 
        t.show();

        if (t.y > -t.h + 5 && t.once) {
            t.once = false;
            tiles.push(new Tile(floor(random(4))));
        }

        // Clean up faded hit tiles
        if (t.isHit && t.hitAlpha <= 0) {
            tiles.splice(i, 1);
            continue;
        }

        // Missed tile check
        if (t.y > height && !t.isHit) {
            combo = 0; 
            triggerGameOver();
        }
    }

    // --- HUD ---
    fill(255, 0, 0); 
    noStroke();
    textSize(50);
    textAlign(CENTER);
    text(score, width / 2, 80);

    if (combo > 1) {
        let shake = map(vol, 0, 0.3, 0, 8); 
        fill(255, 215, 0); 
        textSize(min(30 + combo, 70)); 
        text("x" + combo, width / 2 + random(-shake, shake), 140);
        
        let m = floor(combo / 10) + 1;
        if (m > 1) {
            textSize(20);
            text(m + "X POINTS", width / 2, 190);
        }

        let rank = "CLEAN";
        if (combo > 15) rank = "CRISP";
        if (combo > 30) rank = "GOATED";
        
        textSize(15);
        fill(255); 
        text(rank, width / 2, 165);
    }

    if (feedbackTimer > 0) {
        fill(feedbackColor);
        textSize(40);
        text(feedbackText, width / 2, height / 2 + 50);
        feedbackTimer--; 
    }

    // --- PRO BUTTON ---
    rectMode(CORNER); 
    fill(isProMode ? "#FFD700" : 200); 
    stroke(0);
    strokeWeight(2);
    rect(20, 20, 80, 40, 5); 

    fill(0);
    noStroke();
    textSize(16);
    textAlign(CENTER, CENTER);
    text("PRO", 60, 40); 
}

// INPUT HANDLING
function mousePressed() {
    if (gameState !== "PLAYING") return;
    if (getAudioContext().state !== 'running') getAudioContext().resume();
    let clickedLane = floor(mouseX / (width / 4));
    checkHit(clickedLane);
}

function keyPressed() {
    if (gameState !== "PLAYING") return;
    if (getAudioContext().state !== 'running') getAudioContext().resume();

    let targetLane = -1;
    if (key === 'a' || key === 'A' || keyCode === LEFT_ARROW)  targetLane = 0;
    if (key === 's' || key === 'S' || keyCode === UP_ARROW)    targetLane = 1;
    if (key === 'w' || key === 'W' || keyCode === DOWN_ARROW)  targetLane = 2;
    if (key === 'd' || key === 'D' || keyCode === RIGHT_ARROW) targetLane = 3; 

    if (targetLane !== -1) checkHit(targetLane);
}

function touchStarted() {
    if (gameState !== "PLAYING") return;
    if (getAudioContext().state !== 'running') getAudioContext().resume();

    let targetLane = floor(map(mouseX, 0, width, 0, 4));
    
    if (targetLane >= 0 && targetLane <= 3) {
        checkHit(targetLane);
    }
    return false; 
}

function checkHit(lane) {
    // Find the lowest active non-hit tile
    let t = null;
    for (let i = 0; i < tiles.length; i++) {
        if (!tiles[i].isHit) {
            t = tiles[i];
            break;
        }
    }
    
    if (t && t.lane === lane) {
        if (t.y > -t.h && t.y < height) {
            let distFromBottom = abs(height - (t.y + t.h));
            let multiplier = floor(combo / 10) + 1; 

            if (distFromBottom < 120) { 
                score += (2 * multiplier); 
                combo++; 
                showFeedback("PERFECT x" + multiplier, "#f1c40f"); 
            } else {
                score += (1 * multiplier);
                combo++; 
                showFeedback("GOOD x" + multiplier, "#2ecc71"); 
            }

            // Flag tile as hit so it displays gray feedback and fades
            t.isHit = true;
        } else {
            combo = 0; 
            score = max(0, score - 5); 
            showFeedback("TOO EARLY!", "#e74c3c"); 
        }
    } else {
        combo = 0; 
        triggerGameOver();
    }
}

function triggerGameOver() {
    gameState = "GAMEOVER";
    
    if (canContinue) {
        if (mySound) mySound.pause(); 
    } else {
        if (mySound) mySound.stop();
    }

    const contBtn = document.getElementById('continue-btn');
    if (canContinue) {
        contBtn.style.display = "block"; 
    } else {
        contBtn.style.display = "none";
    }

    let scoreKey = "best_" + currentSongUrl; 
    let previousBest = parseInt(localStorage.getItem(scoreKey)) || 0;
    let isNewRecord = (score > previousBest);

    if (isNewRecord) {
        localStorage.setItem(scoreKey, score);
    }

    let failText = isNewRecord ? "NEW HIGH SCORE!" : "FAILED";
    document.getElementById('fail-text').innerText = failText;
    document.getElementById('fail-text').style.color = isNewRecord ? "#2ecc71" : "#e74c3c"; 
    
    document.getElementById('final-score').innerHTML = `
        SCORE: ${score}<br>
        <span style="font-size: 18px; color: #666;">BEST: ${isNewRecord ? score : previousBest}</span>
    `;
    
    const deathScreen = document.getElementById('death-screen');
    deathScreen.classList.remove('hidden');
    
    let deathButtons = deathScreen.querySelectorAll('.btn');
    
    deathButtons.forEach(btn => {
        btn.style.visibility = "hidden";
        btn.style.opacity = "0";
    });

    setTimeout(() => {
        deathButtons.forEach(btn => {
            btn.style.transition = "opacity 0.5s"; 
            btn.style.visibility = "visible";
            btn.style.opacity = "1";
        });
    }, 700); 
}

function restartGame() {
    document.getElementById('death-screen').classList.add('hidden');
    startGame();
}

function goHome() {
    if (mySound) mySound.stop();
    gameState = "MENU";
    
    document.getElementById('death-screen').classList.add('hidden');
    
    const home = document.getElementById('home-screen');
    home.classList.remove('hidden');
    
    setup();
    playMenuPreview();
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }

function showFeedback(txt, col) {
    feedbackText = txt;
    feedbackColor = col;
    feedbackTimer = 25; 
}

function togglePulse() {
    pulseMode = !pulseMode; 
    setup(); 
}

function toggleControls() {
    controlMode = (controlMode === "CLICK") ? "KEYBOARD" : "CLICK";
    setup(); 
}

function togglePro() {
    isProMode = !isProMode; 
    setup(); 
}

function togglePractice() {
    canContinue = !canContinue; 
    setup(); 
}

function handleRevive() {
    document.getElementById('death-screen').classList.add('hidden');
    tiles = []; 
    tiles.push(new Tile(floor(random(4)))); 
    combo = 0; 
    
    gameState = "PLAYING";
    if (mySound) mySound.play(); 
    showFeedback("RESUMED", "#9b59b6");
}

let previewSound; 

function playMenuPreview() {
    if (previewSound && previewSound.isPlaying()) return;
    if (mySound) mySound.stop();

    let randomSong = random(mySongs);
    
    previewSound = loadSound(randomSong.url, () => {
        if (gameState === "MENU") {
            previewSound.play();
            previewSound.setVolume(0.4); 
            currentPulseColor = randomSong.color;
        }
    });
}
</script>
</body>
</html>
