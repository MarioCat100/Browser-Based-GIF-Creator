<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>qead // rhythm engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hud">
        <button class="hud-btn mobile-only" id="backBtn" onclick="location.reload()">◀ QUIT</button>
        <div class="song-info">
            <div class="song-title" id="songTitle">qead // active channel</div>
        </div>
        <button class="hud-btn mobile-only" id="pauseBtn">PAUSE ⏸</button>
    </header>

    <main class="game-container">
        
        <div class="song-select-dashboard" id="songSelectScreen">
            
            <div class="menu-preview-panel">
                <div class="preview-art-frame">
                    <div class="preview-art-blur" id="menuArtPreview"></div>
                </div>
                <h2 class="preview-title" id="menuSongTitle">SELECT A TRACK</h2>
                <p class="preview-artist" id="menuSongArtist">Import a folder or pick a song</p>
                
                <button class="menu-play-btn" id="menuPlayBtn" style="display: none;">▶ PLAY</button>
                
                <label class="compact-upload-zone">
                    📂 LOAD OSU! MAP FOLDER
                    <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;">
                </label>
                <p style="color: #666; font-size: 0.8rem; margin-top: 8px;">Select a local beatmap folder containing the .mp3 and .osu files</p>
                
                <button id="toggleBgBtn" class="compact-upload-zone" style="margin-top: 15px; background: #222; border: 1px solid #444; font-size: 0.85rem;">ARTWORK: ON</button>
            </div>

            <div style="flex: 1.2; display: flex; flex-direction: column; gap: 15px;">
                <input type="text" id="menuSearchInput" class="menu-search-bar" placeholder="🔍 Type to search tracks (e.g. Brain, xi)..." autocomplete="off">
                <div class="song-wheel" id="songWheelList"></div>
            </div>
            
        </div>
        
        <div class="live-accuracy-hud" id="liveAccuracyDisplay">100.00%</div>
        <div class="live-combo-hud" id="comboDisplay">000x</div>

        <div class="osu-progress-circle" id="progressCircle">
            <div class="circle-inner">
                <span id="progressPercent">0%</span>
            </div>
        </div>

        <div class="arena-wrapper" id="gameArena" style="display: none;">
            <canvas id="gameCanvas"></canvas>
            <div class="rhythm-grid">
                <div class="grid-box" id="box-top-left">Q</div>
                <div class="grid-box" id="box-top-right">E</div>
                <div class="grid-box" id="box-bottom-left">A</div>
                <div class="grid-box" id="box-bottom-right">D</div>
            </div>
        </div>
    </main>

    <div class="pause-overlay" id="pauseOverlay">
        <div class="pause-menu">
            <div class="menu-title">// PAUSED</div>
            <button class="menu-btn btn-continue" id="resumeBtn">CONTINUE</button>
            <!-- REMOVED location.reload() and added unique id for app.js integration -->
            <button class="menu-btn btn-retry" id="pauseRetryBtn">RETRY</button>
            <button class="menu-btn btn-quit" onclick="location.reload()">QUIT TO MENU</button>
        </div>
    </div>

    <div class="results-overlay" id="resultsOverlay">
        <div class="results-card">
            <div class="results-header">
                <div class="results-title">BEATMAP COMPLETED</div>
                <div class="results-subtitle" id="resSongTitle">SONG TITLE</div>
            </div>
            
            <div class="results-body">
                <div class="rank-badge" id="resGrade">A</div>
                
                <div class="stats-matrix">
                    <div class="stat-row perfect"><span class="stat-label">300</span><span class="stat-val" id="res300">0</span></div>
                    <div class="stat-row good"><span class="stat-label">100</span><span class="stat-val" id="res100">0</span></div>
                    <div class="stat-row meh"><span class="stat-label">50</span><span class="stat-val" id="res50">0</span></div>
                    <div class="stat-row miss"><span class="stat-label">MISS</span><span class="stat-val" id="resMiss">0</span></div>
                    <hr class="matrix-divider">
                    <div class="stat-row total"><span class="stat-label">MAX COMBO</span><span class="stat-val" id="resMaxCombo">0x</span></div>
                    <div class="stat-row total"><span class="stat-label">ACCURACY</span><span class="stat-val" id="resAccuracy">0.00%</span></div>
                </div>
            </div>

            <div class="results-footer" style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
                <!-- Changed ID here so it can be targeted specifically in your JS to trigger direct resets -->
                <button class="menu-btn btn-retry" id="playAgainBtn">PLAY AGAIN</button>
                <button class="menu-btn btn-continue" id="homeBtn">HOME</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
